<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة المبتكر التقني</title>

<style>
body{
    background:#121212;
    color:white;
    font-family:Tahoma,sans-serif;
    margin:0;
    padding:15px;
    text-align:center;
}

.header{
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    border-bottom:4px solid #00adb5;
}

h1{
    color:#00adb5;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    padding:20px;
    margin:15px auto;
    max-width:900px;
    border:1px solid #333;
}

.card-title{
    color:#00adb5;
    font-size:20px;
    margin-bottom:15px;
}

.btn{
    background:#00adb5;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    margin-top:15px;
    font-weight:bold;
}

.chess-container{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    width:100%;
    max-width:500px;
    margin:20px auto;
    border:5px solid #393e46;
    aspect-ratio:1/1;
}

.chess-square{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    cursor:pointer;
    user-select:none;
    position:relative;
}

.light{
    background:#f0d9b5;
    color:black;
}

.dark{
    background:#b58863;
    color:black;
}

.selected{
    background:#70a1ff !important;
}

.legal-move::after{
    content:"";
    width:14px;
    height:14px;
    background:#2ed573;
    border-radius:50%;
    position:absolute;
    box-shadow:0 0 10px #2ed573;
}

.legal-attack{
    outline:4px solid #2ed573;
    outline-offset:-4px;
}

.turn{
    color:#00adb5;
    font-weight:bold;
    margin-top:10px;
}

.footer{
    margin-top:40px;
    padding:20px;
    background:#1e1e1e;
    border-top:3px solid #00adb5;
    border-radius:12px;
}

.logo{
    font-size:26px;
    font-weight:bold;
    color:#00adb5;
    letter-spacing:2px;
    text-shadow:0 0 10px #00adb5;
}

.sublogo{
    color:#aaa;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🚀 منصة المبتكر التقني</h1>
    <p>لعبة شطرنج احترافية بالقوانين الحقيقية</p>
</div>

<div class="card">
    <div class="card-title">
        ♟️ لعبة الشطرنج الذكية
    </div>

    <p>
        اضغط على القطعة لرؤية الحركات القانونية بالنقاط الخضراء
    </p>

    <div class="chess-container" id="board"></div>

    <div class="turn" id="turnIndicator">
        دور اللاعب: الأبيض
    </div>

    <button class="btn" onclick="initBoard()">
        إعادة اللعبة 🔄
    </button>
</div>

<div class="footer">
    <div class="logo">
        OSMAN WD ELAWAD
    </div>

    <div class="sublogo">
        Chess System & Web Design
    </div>
</div>

<script>

const initialBoard = [
['♜','♞','♝','♛','♚','♝','♞','♜'],
['♟','♟','♟','♟','♟','♟','♟','♟'],
['','','','','','','',''],
['','','','','','','',''],
['','','','','','','',''],
['','','','','','','',''],
['♙','♙','♙','♙','♙','♙','♙','♙'],
['♖','♘','♗','♕','♔','♗','♘','♖']
];

const whitePieces = ['♙','♖','♘','♗','♕','♔'];
const blackPieces = ['♟','♜','♞','♝','♛','♚'];

let boardState = [];
let selectedSquare = null;
let currentTurn = 'white';
let legalMoves = [];

function initBoard(){
    boardState = JSON.parse(JSON.stringify(initialBoard));
    selectedSquare = null;
    currentTurn = 'white';
    legalMoves = [];

    document.getElementById("turnIndicator").innerText =
    "دور اللاعب: الأبيض";

    renderBoard();
}

function getPieceColor(piece){
    if(whitePieces.includes(piece)) return 'white';
    if(blackPieces.includes(piece)) return 'black';
    return null;
}

function calculateLegalMoves(row,col){

    const piece = boardState[row][col];
    const color = getPieceColor(piece);
    const moves = [];

    if(!piece || color !== currentTurn) return moves;

    // حركة البيدق الأبيض
    if(piece === '♙'){

        if(row > 0 && boardState[row-1][col] === ''){
            moves.push({r:row-1,c:col});

            if(row === 6 && boardState[row-2][col] === ''){
                moves.push({r:row-2,c:col});
            }
        }

        if(row > 0 && col > 0 &&
           getPieceColor(boardState[row-1][col-1]) === 'black'){
            moves.push({r:row-1,c:col-1});
        }

        if(row > 0 && col < 7 &&
           getPieceColor(boardState[row-1][col+1]) === 'black'){
            moves.push({r:row-1,c:col+1});
        }
    }

    // حركة البيدق الأسود
    if(piece === '♟'){

        if(row < 7 && boardState[row+1][col] === ''){
            moves.push({r:row+1,c:col});

            if(row === 1 && boardState[row+2][col] === ''){
                moves.push({r:row+2,c:col});
            }
        }

        if(row < 7 && col > 0 &&
           getPieceColor(boardState[row+1][col-1]) === 'white'){
            moves.push({r:row+1,c:col-1});
        }

        if(row < 7 && col < 7 &&
           getPieceColor(boardState[row+1][col+1]) === 'white'){
            moves.push({r:row+1,c:col+1});
        }
    }

    // الحصان
    if(piece === '♘' || piece === '♞'){

        const knightMoves = [
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ];

        knightMoves.forEach(move=>{

            let nr = row + move[0];
            let nc = col + move[1];

            if(nr>=0 && nr<8 && nc>=0 && nc<8){

                if(boardState[nr][nc] === '' ||
                   getPieceColor(boardState[nr][nc]) !== color){

                    moves.push({r:nr,c:nc});
                }
            }
        });
    }

    // الملك
    if(piece === '♔' || piece === '♚'){

        for(let dr=-1; dr<=1; dr++){
            for(let dc=-1; dc<=1; dc++){

                if(dr===0 && dc===0) continue;

                let nr = row + dr;
                let nc = col + dc;

                if(nr>=0 && nr<8 && nc>=0 && nc<8){

                    if(boardState[nr][nc] === '' ||
                       getPieceColor(boardState[nr][nc]) !== color){

                        moves.push({r:nr,c:nc});
                    }
                }
            }
        }
    }

    // دالة الحركات المستقيمة
    function slidingMoves(directions){

        directions.forEach(dir=>{

            let nr = row + dir[0];
            let nc = col + dir[1];

            while(nr>=0 && nr<8 && nc>=0 && nc<8){

                if(boardState[nr][nc] === ''){

                    moves.push({r:nr,c:nc});

                }else{

                    if(getPieceColor(boardState[nr][nc]) !== color){
                        moves.push({r:nr,c:nc});
                    }

                    break;
                }

                nr += dir[0];
                nc += dir[1];
            }
        });
    }

    const straight = [
        [-1,0],[1,0],[0,-1],[0,1]
    ];

    const diagonal = [
        [-1,-1],[-1,1],[1,-1],[1,1]
    ];

    // الرخ
    if(piece === '♖' || piece === '♜'){
        slidingMoves(straight);
    }

    // الفيل
    if(piece === '♗' || piece === '♝'){
        slidingMoves(diagonal);
    }

    // الوزير
    if(piece === '♕' || piece === '♛'){
        slidingMoves([...straight,...diagonal]);
    }

    return moves;
}

function isMoveLegal(r,c){

    return legalMoves.some(
        move => move.r === r && move.c === c
    );
}

function renderBoard(){

    const board = document.getElementById("board");
    board.innerHTML = '';

    for(let r=0; r<8; r++){

        for(let c=0; c<8; c++){

            const square = document.createElement("div");

            square.className =
            "chess-square " +
            (((r+c)%2===0) ? "light" : "dark");

            square.innerText = boardState[r][c];

            square.dataset.row = r;
            square.dataset.col = c;

            if(selectedSquare &&
               selectedSquare.row===r &&
               selectedSquare.col===c){

                square.classList.add("selected");
            }

            if(isMoveLegal(r,c)){

                if(boardState[r][c] !== ''){
                    square.classList.add("legal-attack");
                }else{
                    square.classList.add("legal-move");
                }
            }

            square.addEventListener("click",handleSquareClick);

            board.appendChild(square);
        }
    }
}

function handleSquareClick(e){

    const r = parseInt(e.currentTarget.dataset.row);
    const c = parseInt(e.currentTarget.dataset.col);

    const piece = boardState[r][c];
    const pieceColor = getPieceColor(piece);

    // تنفيذ الحركة
    if(selectedSquare && isMoveLegal(r,c)){

        boardState[r][c] =
        boardState[selectedSquare.row][selectedSquare.col];

        boardState[selectedSquare.row][selectedSquare.col] = '';

        selectedSquare = null;
        legalMoves = [];

        currentTurn =
        currentTurn === 'white' ? 'black' : 'white';

        document.getElementById("turnIndicator").innerText =
        "دور اللاعب: " +
        (currentTurn === 'white' ? 'الأبيض' : 'الأسود');

        renderBoard();
        return;
    }

    // اختيار قطعة
    if(pieceColor === currentTurn){

        selectedSquare = {
            row:r,
            col:c
        };

        legalMoves = calculateLegalMoves(r,c);

        renderBoard();

    }else{

        selectedSquare = null;
        legalMoves = [];

        renderBoard();
    }
}

document.addEventListener("DOMContentLoaded",initBoard);

</script>

</body>
</html>
