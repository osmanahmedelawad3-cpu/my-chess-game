<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المبتكر التقني</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 10px; text-align: center; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .chess-container { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; max-width: 320px; margin: 10px auto; border: 3px solid #555; aspect-ratio: 1/1; }
        .sq { display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .light { background-color: #f0d9b5; color: #000; }
        .dark { background-color: #b58863; color: #000; }
        .btn { background: #00adb5; color: #fff; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card"><h1>🚀 منصة المبتكر التقني</h1></div>

    <div class="card">
        <h3>👑 لعبة الشطرنج</h3>
        <div class="chess-container" id="board"></div>
        <button class="btn" onclick="initBoard()">إعادة ضبط اللوحة 🔄</button>
    </div>

    <script>
        const initialBoard = [
            ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
            ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
            ['', '', '', '', '', '', '', ''], ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''], ['', '', '', '', '', '', '', ''],
            ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
            ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
        ];
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let selected = null;

        function initBoard() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            render();
        }

        function render() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            boardState.forEach((row, r) => {
                row.forEach((piece, c) => {
                    const sq = document.createElement('div');
                    sq.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                    sq.innerText = piece;
                    sq.onclick = () => {
                        if (selected) {
                            boardState[r][c] = boardState[selected.r][selected.c];
                            boardState[selected.r][selected.c] = '';
                            selected = null;
                            render();
                        } else if (piece !== '') {
                            selected = {r, c};
                            sq.style.backgroundColor = '#70a1ff';
                        }
                    };
                    board.appendChild(sq);
                });
            });
        }
        initBoard();
    </script>
</body>
</html>
